<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PokéGuide DB</title>
<style>
html,body{margin:0;min-height:100%;background:#090d16;color:#e2e8f0;font:15px system-ui,sans-serif}
#status{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}
#status p{color:#94a3b8}
</style>
</head>
<body>
<div id="status"><div><h2>PokéGuide DB</h2><p id="message">Carregando banco de dados completo...</p></div></div>
<script>
(async()=>{
  const total=10, parts=[];
  try {
    for(let i=1;i<=total;i++){
      const name='part-'+String(i).padStart(2,'0')+'.txt';
      const response=await fetch('./app-source/'+name+'?v=20261116',{cache:'no-store'});
      if(!response.ok) throw new Error('Não foi possível carregar '+name+' ('+response.status+').');
      parts.push(await response.text());
    }
    const html=parts.join('');
    if(!html.includes('</html>') || !html.includes('DEFAULT_DATABASE')) throw new Error('O arquivo principal recebido está incompleto.');
    document.open();
    document.write(html);
    document.close();
  } catch(error) {
    document.getElementById('message').textContent='Falha ao carregar o aplicativo: '+error.message+' Atualize a página em alguns instantes.';
    console.error(error);
  }
})();
</script>
</body>
</html>
